# Profitna on a single VPS: Postgres, the app, and Caddy for HTTPS.
# Values come from .env beside this file — see DEPLOY.md.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: profitna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: profitna
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profitna -d profitna"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No ports published: only the app container reaches the database.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://profitna:${POSTGRES_PASSWORD}@db:5432/profitna
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Left empty until you have the accounts; each feature stays off and the
      # app degrades to what it can honestly do. See server/README.md.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      MONO_SECRET_KEY: ${MONO_SECRET_KEY:-}
      MONO_WEBHOOK_SECRET: ${MONO_WEBHOOK_SECRET:-}
      # The owner's console. It answers 404 until an account is created with
      #   docker compose exec app node src/create-admin.js --email you@…
      # Where invitation links point; the request is used when unset.
      PUBLIC_URL: ${PUBLIC_URL:-}
      ADMIN_PATH: ${ADMIN_PATH:-/admin}
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}
      # Ends trials and renews terms. Idle until PAYSTACK_SECRET_KEY is set.
      BILLING_SCHEDULER: ${BILLING_SCHEDULER:-}
      BILLING_INTERVAL_MINUTES: ${BILLING_INTERVAL_MINUTES:-60}
      # Deliberately not set in production: real accounts start empty.
      # SEED_DEMO_DATA: "true"
    # Migrations run to completion before the server accepts traffic.
    command: sh -c "node src/migrate.js && node src/index.js"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # certificates — keep this volume or you re-issue
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
